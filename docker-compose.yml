services:
  db:
    image: mysql:8.3
    container_name: localflix_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-localflix}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # Not publishing 3306 to the host by default — the "app" service reaches
    # this container over the internal Compose network at db:3306 without it.
    # Uncomment below only if you need to connect a host-side DB client for
    # debugging; prefer binding to 127.0.0.1 rather than all interfaces.
    # ports:
    #   - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: localflix_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data/movies:/app/data/movies
      - ./data/serie:/app/data/serie
      - ./data/thumbnail:/app/data/thumbnail
      - ./data/uploads:/app/data/uploads
      - ./data/subtitles:/app/data/subtitles
      - ./config:/app/config
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: