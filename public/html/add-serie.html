<!DOCTYPE html>
<html lang="en">
<head>
  <title>Add a Series — Localflix</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <div id="header"></div>

  <div class="add-form">
    <h2 style="text-align:center; margin-bottom:24px; color:var(--text-primary);">Add a Series</h2>
    <form method="POST" enctype="multipart/form-data" action="/add-serie" name="add">

      <label for="title">Series Title</label>
      <input type="text" id="title" name="title" required maxlength="255">

      <label for="description">Description</label>
      <input type="text" id="description" name="description" maxlength="1000">

      <label for="tags">Tags (comma separated)</label>
      <input type="text" id="tags" name="tags" maxlength="255">

      <label for="author">Author / Creator</label>
      <input type="text" id="author" name="author" maxlength="255">

      <label for="NoS">Number of Seasons</label>
      <input type="number" id="NoS" name="NoS" min="1" max="9999999999" required>

      <label for="releaseDate">Release Date (YYYY-MM-DD)</label>
      <input type="text" id="releaseDate" name="releaseDate" placeholder="2024-01-15" maxlength="10">

      <label for="image">Thumbnail Image</label>
      <input type="file" accept="image/*" id="image" name="image">

      <input type="submit" value="Create Series" class="btn-submit">
    </form>
  </div>

  <script src="/js/header.js"></script>
</body>
</html>
