<!DOCTYPE html>
<html lang="en">
<head>
  <title>Add Content — Localflix</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <div id="header"></div>
  <div class="add-content-page">
    <h2 class="section-title" style="text-align:center;display:block;border-bottom:none;margin-bottom:32px;">What would you like to add?</h2>
    <div class="add-cards">
      <a href="/add-movie" class="add-card">
        <div class="add-card-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/>
          </svg>
        </div>
        <h3>Add a Movie</h3>
        <p>Upload a single video file with subtitles and audio tracks</p>
      </a>
      <a href="/add-serie" class="add-card">
        <div class="add-card-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
            <polyline points="5 10 9 7 9 13"/>
          </svg>
        </div>
        <h3>Add a Series</h3>
        <p>Create a new TV series to organize episodes</p>
      </a>
      <a href="/add-episode" class="add-card">
        <div class="add-card-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18" fill="none"/>
          </svg>
        </div>
        <h3>Add an Episode</h3>
        <p>Add a new episode to an existing series</p>
      </a>
    </div>
  </div>
  <script src="/js/header.js"></script>
</body>
</html>
